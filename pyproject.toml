[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-context-box"
version = "0.3.0-dev"
description = "Self-maintaining context system for Claude Code projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Claude Context Box Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
ccb = "ccb.cli:main"

[project.urls]
Homepage = "https://github.com/alter/claude-context-box"
Issues = "https://github.com/alter/claude-context-box/issues"

[tool.hatch.build.targets.wheel]
packages = ["ccb"]

[tool.hatch.build.targets.wheel.shared-data]
"ccb/assets" = "ccb/assets"

[tool.ruff]
line-length = 100
target-version = "py310"
