[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-context-box"
version = "0.8.0"
description = "Self-maintaining context system for Claude Code projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Claude Context Box Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff"]
# LLM-summarized session captures (Phase F). Install via:
#   .claude/ccb-venv/bin/pip install 'claude-context-box[llm]'
# Then `export ANTHROPIC_API_KEY=...` and the SessionEnd hook will start
# appending decisions / issues / summary sections to .ccb/daily_log/<date>.md.
llm = ["anthropic>=0.39"]

[project.scripts]
ccb = "ccb.cli:main"

[project.urls]
Homepage = "https://github.com/alter/claude-context-box"
Issues = "https://github.com/alter/claude-context-box/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccb*"]

[tool.setuptools.package-data]
ccb = [
    "assets/claude_md/*.md",
    "assets/skills/*/SKILL.md",
    "assets/hooks/*.py",
    "assets/engine/*.py",
    "assets/git/*",
    "assets/settings/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
source = ["ccb"]
# Engine, hooks, and skill .md files are exercised through subprocess +
# end-to-end tests, not in-process imports — line coverage of the asset
# directory would always read 0% even though we test it heavily.
omit = [
    "ccb/assets/engine/*",
    "ccb/assets/hooks/*",
    "ccb/assets/skills/*",
    "ccb/assets/git/*",
    "ccb/assets/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
